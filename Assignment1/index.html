<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration and Result</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar">
    <div class="logo">Student Portal</div>
  </nav>

  <div class="container" id="register">
    <h1>Student Registration</h1>

    <form id="studentForm" novalidate>
      <h3>Student Details</h3>
      <div class="row">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter name">
        </div>
        <div class="field">
          <label for="roll">Roll Number</label>
          <input type="text" id="roll" placeholder="Enter roll number">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter email">
        </div>
      </div>

      <h3>Marks (0-100)</h3>
      <div class="row">
        <div class="field">
          <label for="maths">Maths</label>
          <input type="number" id="maths" placeholder="0-100">
        </div>
        <div class="field">
          <label for="science">Science</label>
          <input type="number" id="science" placeholder="0-100">
        </div>
        <div class="field">
          <label for="english">English</label>
          <input type="number" id="english" placeholder="0-100">
        </div>
      </div>

      <p id="error" class="error"></p>

      <button type="submit">Submit</button>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
